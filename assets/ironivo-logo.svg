<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="ironivoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757" />
      <stop offset="100%" stop-color="#ff6b81" />
    </linearGradient>
    <linearGradient id="ironivoDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
  </defs>

  <!-- Logo Mark / Icon -->
  <g transform="translate(6, 6)">
    <!-- Outer Shield / Hex Ring -->
    <path d="M24 2 L42 12 V36 L24 46 L6 36 V12 Z" fill="url(#ironivoDark)" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Dynamic Power Grip / Iron Bolt Accent -->
    <path d="M22 10 L14 26 H24 L22 38 L34 22 H24 Z" fill="url(#ironivoGrad)" />
    
    <!-- Precision Accent Dot -->
    <circle cx="34" cy="14" r="3" fill="#ff4757" />
  </g>

  <!-- Brand Typography: IRONIVO -->
  <text x="64" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="1.5" fill="#111827">
    IRON<tspan fill="url(#ironivoGrad)">IVO</tspan>
  </text>
</svg>
